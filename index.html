<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#8fd3ff">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>채팅도치</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
</head>
<body>
<canvas id="game"></canvas>

<!-- 가로 모드 안내 -->
<div id="rotate-hint"><div class="rot-icon">📱↻</div><div>폰을 가로로 돌려 주세요</div></div>

<!-- 캐릭터 꾸미기 화면 -->
<div id="customize" class="screen">
  <div class="cz-left">
    <h1 class="title">채팅도치</h1>
    <div class="preview-hint">← 끌어서 돌려 보세요 →</div>
  </div>
  <div class="cz-panel">
    <label class="row"><span>내 이름</span><input id="in-name" maxlength="8" placeholder="이름을 써 주세요"></label>
    <label class="row"><span>집 이름</span><input id="in-house" maxlength="10" placeholder="우리 집 이름"></label>
    <div class="row"><span>집 색</span><div class="swatches" id="sw-house"></div></div>
    <div class="row"><span>머리 모양</span><div class="chips" id="ch-hair"></div></div>
    <div class="row"><span>머리 색</span><div class="swatches" id="sw-hair"></div></div>
    <div class="row"><span>눈 색</span><div class="swatches" id="sw-eye"></div></div>
    <div class="row"><span>옷 색</span><div class="swatches" id="sw-cloth"></div></div>
    <button id="btn-start" class="big-btn" disabled>시작하기</button>
  </div>
</div>

<!-- 게임 HUD -->
<div id="hud" class="hidden">
  <div class="top-bar">
    <button class="top-btn" id="btn-chat">💬</button>
    <button class="top-btn" id="btn-pet">🐾</button>
    <button class="top-btn" id="btn-ride">🚲</button>
    <button class="top-btn hidden" id="btn-window">🪟</button>
    <button class="top-btn hidden" id="btn-expand">➕</button>
    <div id="clock"><span id="clock-icon">☀️</span><span id="clock-text"></span><span id="weather-icon"></span></div>
    <button class="top-btn small" id="btn-setting">⚙️</button>
  </div>

  <button class="side-btn" id="btn-game">🎮<small>미니게임</small></button>
  <div id="joy-zone"></div>
  <div id="joy" class="hidden"><div id="joy-knob"></div></div>

  <div class="right-btns">
    <button class="act-btn big" id="btn-jump">점프</button>
    <button class="act-btn" id="btn-down" style="display:none">⬇️</button>
    <button class="act-btn" id="btn-up" style="display:none">⬆️</button>
    <button class="act-btn" id="btn-special" style="display:none">✨</button>
  </div>
  <div class="center-btns">
    <button class="ctx-btn" id="btn-context" style="display:none"></button>
    <button class="ctx-btn ghost" id="btn-dismount" style="display:none">내리기</button>
    <button class="ctx-btn" id="btn-drop" style="display:none">⬇️ 내려놓기</button>
  </div>

  <!-- 집 꾸미기 도구 -->
  <div id="deco-bar" class="hidden">
    <button class="deco-tool" id="btn-deco">🛋️ 꾸미기</button>
    <div id="deco-edit" class="hidden">
      <button class="deco-tool" id="btn-rot">↻ 돌리기</button>
      <button class="deco-tool" id="btn-del">📦 넣기</button>
      <button class="deco-tool" id="btn-deco-done">✔ 다 했어요</button>
    </div>
  </div>
  <div id="catalog" class="hidden"></div>
</div>

<!-- 패널(채팅, 반려동물, 탈것, 설정) -->
<div id="panel" class="hidden">
  <div class="panel-box">
    <div class="panel-head"><span id="panel-title"></span><button id="panel-close">✕</button></div>
    <div id="panel-body"></div>
  </div>
</div>

<!-- 이름 입력 모달 -->
<div id="modal" class="hidden">
  <div class="modal-box">
    <div id="modal-title"></div>
    <input id="modal-input" maxlength="8">
    <div class="modal-btns"><button id="modal-cancel">취소</button><button id="modal-ok">좋아요</button></div>
  </div>
</div>

<div id="mini" class="hidden"></div>
<div id="toast"></div>
<div id="fade"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
